name: Installer checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify installation and rollback in temporary directories
        run: python3 scripts/test-install.py -v
